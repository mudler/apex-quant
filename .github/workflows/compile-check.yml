name: compile-check

# Smoke check: every shipped Python script must parse/compile on all supported
# Python versions. Catches architecture-specific generator variants (and anything
# else) landing unparsable — e.g. backslashes inside f-string expressions, which
# only became legal in Python 3.12 (PEP 701).
on:
  push:
  pull_request:

jobs:
  compileall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all shipped Python scripts
        run: python -m compileall -q scripts
